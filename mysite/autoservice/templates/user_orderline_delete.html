{% extends 'base.html' %}

{% block title %}Paslaugos pašalinimas{% endblock %}

{% block content %}

<p>Ar tikrai norite pašalinti paslaugą "{{ orderline }}"?</p>
<form method="post">

</form>
{% endblock %}
