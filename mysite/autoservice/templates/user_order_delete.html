{% extends 'base.html' %}

{% block title %}Taisymo pašalinimas{% endblock %}

{% block content %}
<h1>Taisymo pašalinimas</h1>
<p>Ar tikrai norite pašalinti taisymą "{{ order }}"?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-primary" type="submit">Taip</button>
    <a class="btn btn-secondary" href="{% url 'order' order.pk %}">Ne</a>
</form>
{% endblock %}
